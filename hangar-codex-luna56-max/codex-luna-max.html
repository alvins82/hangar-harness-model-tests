<!doctype html>
<!--
Benchmark context:
I've been testing a simple prompt with different model and harness combinations to work out which one produces best results. I do this in '/goal' mode.

Prompt -
"Build a single-page Three.js sci-fi hangar with hovering drones, animated warning lights, emissive runway strips, and subtle volumetric-style fog planes. Include drone formation toggle and cinematic camera path. Output one self-contained HTML file with inline JavaScript."
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#05090c">
  <title>Hangar 17 — Luna</title>
  <style>
    :root {
      --ink: #e7f7f7;
      --muted: #769497;
      --cyan: #61f5e3;
      --amber: #ffbf58;
      --red: #ff4c3e;
      --panel: rgba(7, 14, 18, 0.68);
      --line: rgba(146, 229, 224, 0.18);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #030608;
      color: var(--ink);
      font-family: "SFMono-Regular", "Roboto Mono", "Segoe UI Mono", ui-monospace, monospace;
    }

    body {
      cursor: crosshair;
    }

    button {
      font: inherit;
    }

    #scene {
      position: fixed;
      inset: 0;
    }

    #scene canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .fx,
    .hud {
      position: fixed;
      inset: 0;
      pointer-events: none;
    }

    .fx {
      z-index: 2;
    }

    .vignette {
      background:
        radial-gradient(circle at 50% 48%, transparent 28%, rgba(2, 5, 7, 0.24) 68%, rgba(0, 0, 0, 0.82) 120%),
        linear-gradient(180deg, rgba(0, 0, 0, 0.45), transparent 22%, transparent 78%, rgba(0, 0, 0, 0.48));
    }

    .scanlines {
      opacity: 0.12;
      background: repeating-linear-gradient(
        180deg,
        rgba(160, 235, 229, 0.08) 0,
        rgba(160, 235, 229, 0.08) 1px,
        transparent 1px,
        transparent 4px
      );
      mix-blend-mode: overlay;
    }

    .grain {
      opacity: 0.11;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.55'/%3E%3C/svg%3E");
      animation: grain 0.22s steps(2) infinite;
    }

    @keyframes grain {
      0% { transform: translate(0, 0); }
      25% { transform: translate(-1.5%, 1%); }
      50% { transform: translate(1%, -1.5%); }
      75% { transform: translate(1.5%, 1.5%); }
      100% { transform: translate(-1%, -1%); }
    }

    .hud {
      z-index: 5;
      padding: clamp(20px, 3vw, 46px);
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: auto 1fr auto;
    }

    .brand {
      align-self: start;
      justify-self: start;
    }

    .kicker,
    .data-label,
    .status,
    .button-top,
    .hint,
    .coordinate {
      letter-spacing: 0.19em;
      text-transform: uppercase;
    }

    .kicker {
      margin-bottom: 8px;
      color: var(--cyan);
      font-size: 9px;
      opacity: 0.76;
    }

    h1 {
      margin: 0;
      font-family: "Arial Narrow", "Helvetica Neue", sans-serif;
      font-size: clamp(24px, 3.1vw, 49px);
      font-weight: 300;
      line-height: 0.88;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }

    h1 span {
      color: var(--amber);
      font-weight: 700;
    }

    .brand-rule {
      width: min(280px, 36vw);
      height: 1px;
      margin-top: 14px;
      background: linear-gradient(90deg, var(--cyan), rgba(97, 245, 227, 0));
      opacity: 0.52;
    }

    .system {
      align-self: start;
      justify-self: end;
      min-width: 206px;
      padding: 13px 15px 12px;
      background:
        linear-gradient(135deg, rgba(92, 233, 220, 0.06), transparent 52%),
        var(--panel);
      border: 1px solid var(--line);
      clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 12px 100%, 0 calc(100% - 12px));
      backdrop-filter: blur(14px);
    }

    .status {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      color: #b7d1d2;
      font-size: 8px;
    }

    .status + .status {
      margin-top: 9px;
    }

    .status strong {
      color: var(--ink);
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.08em;
    }

    .status-live {
      color: var(--cyan);
    }

    .status-live::before {
      content: "";
      display: inline-block;
      width: 5px;
      height: 5px;
      margin-right: 8px;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 10px var(--cyan);
      animation: live 1.8s ease-in-out infinite;
    }

    @keyframes live {
      50% { opacity: 0.32; }
    }

    .side-data {
      align-self: center;
      justify-self: start;
      display: grid;
      gap: 13px;
      padding-left: 12px;
      border-left: 1px solid rgba(97, 245, 227, 0.25);
    }

    .datum {
      min-width: 112px;
    }

    .data-label {
      color: var(--muted);
      font-size: 7px;
    }

    .data-value {
      margin-top: 4px;
      color: #c9e8e6;
      font-size: 11px;
      letter-spacing: 0.08em;
    }

    .bars {
      display: flex;
      gap: 2px;
      margin-top: 6px;
    }

    .bars i {
      width: 11px;
      height: 2px;
      background: var(--cyan);
      box-shadow: 0 0 6px rgba(97, 245, 227, 0.5);
    }

    .bars i:last-child {
      opacity: 0.22;
    }

    .reticle {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 46px;
      height: 46px;
      transform: translate(-50%, -50%);
      border: 1px solid rgba(121, 229, 220, 0.17);
      border-radius: 50%;
      opacity: 0.65;
    }

    .reticle::before,
    .reticle::after {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      background: rgba(138, 238, 230, 0.48);
      transform: translate(-50%, -50%);
    }

    .reticle::before {
      width: 64px;
      height: 1px;
      clip-path: polygon(0 0, 34% 0, 34% 100%, 66% 100%, 66% 0, 100% 0, 100% 100%, 0 100%);
    }

    .reticle::after {
      width: 1px;
      height: 64px;
      clip-path: polygon(0 0, 100% 0, 100% 34%, 0 34%, 0 66%, 100% 66%, 100% 100%, 0 100%);
    }

    .coordinate {
      position: absolute;
      top: calc(50% + 36px);
      left: 50%;
      transform: translateX(-50%);
      color: rgba(164, 211, 211, 0.55);
      font-size: 6px;
    }

    .hint {
      align-self: end;
      justify-self: start;
      max-width: 250px;
      color: rgba(178, 208, 208, 0.55);
      font-size: 7px;
      line-height: 1.8;
    }

    .hint::before {
      content: "◈";
      margin-right: 9px;
      color: var(--amber);
    }

    .controls {
      align-self: end;
      justify-self: end;
      display: flex;
      gap: 8px;
      pointer-events: auto;
    }

    .hud-button {
      position: relative;
      width: min(192px, 20vw);
      min-width: 146px;
      height: 55px;
      padding: 8px 14px 9px;
      overflow: hidden;
      color: var(--ink);
      text-align: left;
      background: rgba(7, 14, 18, 0.72);
      border: 1px solid rgba(128, 219, 215, 0.25);
      clip-path: polygon(0 0, calc(100% - 11px) 0, 100% 11px, 100% 100%, 0 100%);
      backdrop-filter: blur(14px);
      cursor: pointer;
      transition: border-color 160ms ease, background 160ms ease, transform 160ms ease;
    }

    .hud-button:hover,
    .hud-button:focus-visible {
      outline: none;
      border-color: rgba(97, 245, 227, 0.72);
      background: rgba(13, 27, 31, 0.88);
      transform: translateY(-2px);
    }

    .hud-button::after {
      content: "";
      position: absolute;
      right: 0;
      bottom: 0;
      left: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--cyan), transparent);
      transform-origin: left;
      transform: scaleX(0.22);
      transition: transform 240ms ease;
    }

    .hud-button:hover::after,
    .hud-button.active::after {
      transform: scaleX(1);
    }

    .button-top {
      display: block;
      margin-bottom: 5px;
      color: var(--muted);
      font-size: 7px;
    }

    .button-main {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 10px;
      letter-spacing: 0.08em;
    }

    .button-main b {
      color: var(--cyan);
      font-size: 13px;
      font-weight: 400;
    }

    .progress {
      position: absolute;
      right: 0;
      bottom: 0;
      left: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--amber), var(--cyan));
      transform-origin: left;
      transform: scaleX(var(--progress, 0));
      opacity: 0;
    }

    .hud-button.active .progress {
      opacity: 0.85;
    }

    .corner {
      position: fixed;
      z-index: 4;
      width: 38px;
      height: 38px;
      pointer-events: none;
    }

    .corner::before,
    .corner::after {
      content: "";
      position: absolute;
      background: rgba(118, 216, 210, 0.25);
    }

    .corner::before { width: 38px; height: 1px; }
    .corner::after { width: 1px; height: 38px; }
    .corner.tl { top: 14px; left: 14px; }
    .corner.tr { top: 14px; right: 14px; transform: rotate(90deg); }
    .corner.br { right: 14px; bottom: 14px; transform: rotate(180deg); }
    .corner.bl { bottom: 14px; left: 14px; transform: rotate(270deg); }

    #boot {
      position: fixed;
      z-index: 20;
      inset: 0;
      display: grid;
      place-items: center;
      background: #030608;
      transition: opacity 900ms ease, visibility 900ms ease;
    }

    #boot.ready {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .boot-box {
      width: min(370px, 74vw);
      text-align: center;
    }

    .boot-mark {
      width: 48px;
      height: 48px;
      margin: 0 auto 20px;
      border: 1px solid rgba(97, 245, 227, 0.35);
      transform: rotate(45deg);
      animation: boot 1.8s ease-in-out infinite;
    }

    .boot-mark::after {
      content: "";
      position: absolute;
      inset: 12px;
      background: var(--cyan);
      box-shadow: 0 0 24px rgba(97, 245, 227, 0.8);
    }

    @keyframes boot {
      50% { transform: rotate(225deg) scale(0.72); opacity: 0.45; }
    }

    .boot-title {
      margin-bottom: 12px;
      font-size: 9px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
    }

    .boot-line {
      height: 1px;
      background: rgba(97, 245, 227, 0.14);
      overflow: hidden;
    }

    .boot-line::after {
      content: "";
      display: block;
      width: 34%;
      height: 100%;
      background: var(--cyan);
      box-shadow: 0 0 9px var(--cyan);
      animation: load 1.1s ease-in-out infinite;
    }

    @keyframes load {
      from { transform: translateX(-100%); }
      to { transform: translateX(300%); }
    }

    #error {
      display: none;
      max-width: 520px;
      margin: 0 24px;
      color: #ffd8d4;
      text-align: center;
      line-height: 1.7;
    }

    @media (max-width: 720px) {
      .hud {
        padding: 22px 18px;
      }

      .system,
      .side-data,
      .hint,
      .reticle,
      .coordinate {
        display: none;
      }

      .controls {
        grid-column: 1 / -1;
        justify-self: stretch;
      }

      .hud-button {
        width: 50%;
        min-width: 0;
      }

      h1 {
        font-size: 26px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .grain,
      .status-live::before,
      .boot-mark,
      .boot-line::after {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <main id="scene" aria-label="Interactive three-dimensional view of Hangar 17"></main>

  <div class="fx vignette"></div>
  <div class="fx scanlines"></div>
  <div class="fx grain"></div>

  <div class="corner tl"></div>
  <div class="corner tr"></div>
  <div class="corner br"></div>
  <div class="corner bl"></div>

  <section class="hud" aria-label="Hangar controls">
    <header class="brand">
      <div class="kicker">Lunar Logistics / Deck 04</div>
      <h1>Hangar <span>17</span></h1>
      <div class="brand-rule"></div>
    </header>

    <aside class="system" aria-label="System status">
      <div class="status"><span>Facility</span><strong class="status-live">Online</strong></div>
      <div class="status"><span>Local time</span><strong id="localTime">00:00:00</strong></div>
      <div class="status"><span>Camera</span><strong id="cameraMode">Cine / A</strong></div>
    </aside>

    <aside class="side-data" aria-label="Telemetry">
      <div class="datum">
        <div class="data-label">Drone uplink</div>
        <div class="data-value">06 / 06</div>
        <div class="bars"><i></i><i></i><i></i><i></i><i></i></div>
      </div>
      <div class="datum">
        <div class="data-label">Atmosphere</div>
        <div class="data-value">0.82 BAR</div>
      </div>
      <div class="datum">
        <div class="data-label">Bay temperature</div>
        <div class="data-value">–17.4°C</div>
      </div>
    </aside>

    <div class="reticle"></div>
    <div class="coordinate" id="coordinate">AZ 017.04 / EL 08.32</div>

    <div class="hint">Move pointer to inspect · select controls to reconfigure patrol</div>

    <div class="controls">
      <button class="hud-button" id="formationButton" type="button" aria-label="Toggle drone formation">
        <span class="button-top">Fleet command / 01</span>
        <span class="button-main"><span id="formationLabel">Formation: Delta</span><b>⌁</b></span>
      </button>
      <button class="hud-button active" id="cinemaButton" type="button" aria-label="Toggle cinematic camera path" aria-pressed="true">
        <span class="button-top">Navigation / 02</span>
        <span class="button-main"><span id="cinemaLabel">Exit cinematic</span><b>▷</b></span>
        <span class="progress" id="cinemaProgress"></span>
      </button>
    </div>
  </section>

  <div id="boot">
    <div class="boot-box" id="bootVisual">
      <div class="boot-mark"></div>
      <div class="boot-title">Pressurising Hangar 17</div>
      <div class="boot-line"></div>
    </div>
    <div id="error"></div>
  </div>

  <script type="module">
    (async function () {
      "use strict";

      var boot = document.getElementById("boot");
      var bootVisual = document.getElementById("bootVisual");
      var errorPanel = document.getElementById("error");

      function fail(message) {
        bootVisual.style.display = "none";
        errorPanel.style.display = "block";
        errorPanel.textContent = message;
      }

      var THREE;
      try {
        THREE = await import("https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js");
      } catch (error) {
        fail("Hangar telemetry could not load. Check the network connection and reload this page.");
        return;
      }

      var container = document.getElementById("scene");
      var formationButton = document.getElementById("formationButton");
      var formationLabel = document.getElementById("formationLabel");
      var cinemaButton = document.getElementById("cinemaButton");
      var cinemaLabel = document.getElementById("cinemaLabel");
      var cinemaProgress = document.getElementById("cinemaProgress");
      var cameraMode = document.getElementById("cameraMode");
      var localTime = document.getElementById("localTime");
      var coordinate = document.getElementById("coordinate");

      var renderer;
      try {
        renderer = new THREE.WebGLRenderer({
          antialias: true,
          alpha: false,
          powerPreference: "high-performance"
        });
      } catch (error) {
        fail("This experience needs WebGL. Enable hardware acceleration or open it in a WebGL-capable browser.");
        return;
      }

      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.75));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.04;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      container.appendChild(renderer.domElement);

      var scene = new THREE.Scene();
      scene.background = new THREE.Color(0x020608);
      scene.fog = new THREE.FogExp2(0x071116, 0.0125);

      var camera = new THREE.PerspectiveCamera(52, window.innerWidth / window.innerHeight, 0.1, 240);
      camera.position.set(0, 8.4, 32);

      var clock = new THREE.Clock();
      var pointer = new THREE.Vector2();
      var cinematic = true;
      var cinematicStart = performance.now();
      var cinematicDuration = 30000;
      var formation = "delta";
      var reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      var darkMetal = new THREE.MeshStandardMaterial({
        color: 0x18252b,
        metalness: 0.86,
        roughness: 0.3
      });
      var edgeMetal = new THREE.MeshStandardMaterial({
        color: 0x33464e,
        metalness: 0.92,
        roughness: 0.2
      });
      var panelMaterial = new THREE.MeshStandardMaterial({
        color: 0x111c21,
        metalness: 0.7,
        roughness: 0.46
      });
      var floorMaterial = new THREE.MeshStandardMaterial({
        color: 0x10191c,
        metalness: 0.78,
        roughness: 0.29
      });
      var cyanGlow = new THREE.MeshStandardMaterial({
        color: 0x183c3b,
        emissive: 0x35f1d8,
        emissiveIntensity: 3.1,
        metalness: 0.25,
        roughness: 0.3
      });
      var amberGlow = new THREE.MeshStandardMaterial({
        color: 0x4c2b0c,
        emissive: 0xff9f24,
        emissiveIntensity: 3.8,
        metalness: 0.2,
        roughness: 0.34
      });
      var redGlow = new THREE.MeshStandardMaterial({
        color: 0x5b100b,
        emissive: 0xff291d,
        emissiveIntensity: 2,
        metalness: 0.05,
        roughness: 0.28
      });
      var blackGlass = new THREE.MeshStandardMaterial({
        color: 0x020405,
        metalness: 0.92,
        roughness: 0.08
      });

      function box(width, height, depth, material, x, y, z) {
        var mesh = new THREE.Mesh(new THREE.BoxGeometry(width, height, depth), material);
        mesh.position.set(x || 0, y || 0, z || 0);
        return mesh;
      }

      function cylinder(radiusTop, radiusBottom, height, segments, material) {
        return new THREE.Mesh(
          new THREE.CylinderGeometry(radiusTop, radiusBottom, height, segments),
          material
        );
      }

      function beamBetween(a, b, thickness, material) {
        var direction = new THREE.Vector3().subVectors(b, a);
        var mesh = box(thickness, direction.length(), thickness, material);
        mesh.position.copy(a).add(b).multiplyScalar(0.5);
        mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction.clone().normalize());
        return mesh;
      }

      function makeLabel(text, color, width) {
        var canvas = document.createElement("canvas");
        canvas.width = 512;
        canvas.height = 128;
        var context = canvas.getContext("2d");
        context.clearRect(0, 0, 512, 128);
        context.strokeStyle = color;
        context.globalAlpha = 0.4;
        context.strokeRect(3, 3, 506, 122);
        context.globalAlpha = 1;
        context.fillStyle = color;
        context.font = "500 44px monospace";
        context.textAlign = "center";
        context.textBaseline = "middle";
        context.fillText(text, 256, 65);
        var texture = new THREE.CanvasTexture(canvas);
        texture.colorSpace = THREE.SRGBColorSpace;
        var material = new THREE.SpriteMaterial({
          map: texture,
          transparent: true,
          depthWrite: false,
          opacity: 0.86
        });
        var sprite = new THREE.Sprite(material);
        sprite.scale.set(width, width / 4, 1);
        return sprite;
      }

      var hangar = new THREE.Group();
      scene.add(hangar);

      var floor = box(46, 0.45, 112, floorMaterial, 0, -0.3, -18);
      floor.receiveShadow = true;
      hangar.add(floor);

      var floorInset = box(16, 0.03, 106, panelMaterial, 0, -0.055, -18);
      floorInset.receiveShadow = true;
      hangar.add(floorInset);

      for (var floorZ = 31; floorZ >= -67; floorZ -= 7) {
        var seam = box(45, 0.018, 0.045, edgeMetal, 0, -0.05, floorZ);
        seam.material = edgeMetal;
        hangar.add(seam);
      }

      for (var floorX = -20; floorX <= 20; floorX += 5) {
        hangar.add(box(0.045, 0.02, 108, edgeMetal, floorX, -0.048, -18));
      }

      var wallGeometry = new THREE.BoxGeometry(1.1, 13.8, 8.4);
      for (var side = -1; side <= 1; side += 2) {
        for (var wallZ = 27; wallZ >= -57; wallZ -= 9.2) {
          var wallPanel = new THREE.Mesh(wallGeometry, panelMaterial);
          wallPanel.position.set(side * 22.4, 6.2, wallZ);
          wallPanel.receiveShadow = true;
          hangar.add(wallPanel);

          var inset = box(0.13, 8.4, 5.9, blackGlass, side * 21.81, 6.3, wallZ);
          hangar.add(inset);

          var wallLine = box(0.15, 0.08, 5.2, cyanGlow, side * 21.7, 2.1, wallZ);
          hangar.add(wallLine);
        }
      }

      for (var ribZ = 31; ribZ >= -62; ribZ -= 9.2) {
        var leftBase = new THREE.Vector3(-21.8, 0, ribZ);
        var leftTop = new THREE.Vector3(-18.2, 13.6, ribZ);
        var rightBase = new THREE.Vector3(21.8, 0, ribZ);
        var rightTop = new THREE.Vector3(18.2, 13.6, ribZ);
        hangar.add(beamBetween(leftBase, leftTop, 0.42, edgeMetal));
        hangar.add(beamBetween(rightBase, rightTop, 0.42, edgeMetal));
        hangar.add(beamBetween(leftTop, rightTop, 0.48, edgeMetal));
        hangar.add(beamBetween(new THREE.Vector3(-18.1, 13.5, ribZ), new THREE.Vector3(-12.4, 10.2, ribZ), 0.22, darkMetal));
        hangar.add(beamBetween(new THREE.Vector3(18.1, 13.5, ribZ), new THREE.Vector3(12.4, 10.2, ribZ), 0.22, darkMetal));
      }

      for (var ceilingX = -16; ceilingX <= 16; ceilingX += 8) {
        hangar.add(box(5.8, 0.28, 102, panelMaterial, ceilingX, 13.75, -17));
      }

      var door = new THREE.Group();
      door.position.set(0, 5.8, -68.2);
      door.add(box(32, 13, 1.4, darkMetal));
      door.add(box(27.8, 10.7, 1.52, panelMaterial, 0, 0, 0.12));
      door.add(box(0.35, 10.7, 1.66, edgeMetal, 0, 0, 0.25));
      door.add(box(27.8, 0.2, 1.66, edgeMetal, 0, 0, 0.25));
      for (var doorX = -10.2; doorX <= 10.2; doorX += 6.8) {
        door.add(box(0.12, 10.2, 1.7, edgeMetal, doorX, 0, 0.28));
      }
      for (var doorLightX = -12.6; doorLightX <= 12.6; doorLightX += 4.2) {
        door.add(box(1.8, 0.13, 1.76, amberGlow, doorLightX, -4.7, 0.32));
      }
      var doorLabel = makeLabel("LUNA / H17", "#6ff7e8", 10.5);
      doorLabel.position.set(0, 3.3, 1.15);
      door.add(doorLabel);
      hangar.add(door);

      for (var bayIndex = 0; bayIndex < 6; bayIndex++) {
        var bayLabelLeft = makeLabel("BAY " + String(bayIndex + 1).padStart(2, "0"), "#61f5e3", 4.4);
        bayLabelLeft.position.set(-21.3, 9.4, 22 - bayIndex * 15);
        bayLabelLeft.rotation.y = Math.PI / 2;
        hangar.add(bayLabelLeft);
      }

      var runwayMaterials = [];
      for (var runwayZ = 28; runwayZ >= -61; runwayZ -= 5.2) {
        var runwayMat = cyanGlow.clone();
        runwayMaterials.push(runwayMat);
        var stripLeft = box(0.18, 0.08, 3.5, runwayMat, -5.3, 0.01, runwayZ);
        var stripRight = box(0.18, 0.08, 3.5, runwayMat, 5.3, 0.01, runwayZ);
        hangar.add(stripLeft, stripRight);

        if (Math.round(runwayZ) % 2 === 0) {
          hangar.add(box(0.15, 0.075, 1.25, amberGlow, 0, 0.02, runwayZ));
        }
      }

      var threshold = new THREE.Group();
      for (var thresholdX = -4; thresholdX <= 4; thresholdX += 2) {
        threshold.add(box(0.9, 0.07, 4.5, amberGlow, thresholdX, 0, 0));
      }
      threshold.position.set(0, 0.02, 25);
      hangar.add(threshold);

      var warningLights = [];
      function addWarningLight(x, z, phase) {
        var assembly = new THREE.Group();
        assembly.position.set(x, 11.6, z);
        var mount = cylinder(0.36, 0.48, 0.25, 12, darkMetal);
        assembly.add(mount);

        var bulbMaterial = redGlow.clone();
        var bulb = new THREE.Mesh(new THREE.SphereGeometry(0.22, 12, 8), bulbMaterial);
        bulb.position.y = -0.28;
        assembly.add(bulb);

        var light = new THREE.PointLight(0xff281c, 0, 8, 2);
        light.position.y = -0.4;
        assembly.add(light);
        assembly.userData = { bulb: bulb, light: light, phase: phase };
        warningLights.push(assembly);
        hangar.add(assembly);
      }

      for (var warningZ = 18; warningZ >= -48; warningZ -= 16.5) {
        addWarningLight(-19.2, warningZ, warningLights.length * 0.8);
        addWarningLight(19.2, warningZ, warningLights.length * 0.8);
      }

      var hemisphere = new THREE.HemisphereLight(0x79c8cf, 0x071013, 0.75);
      scene.add(hemisphere);

      var lunarLight = new THREE.DirectionalLight(0xaedaff, 1.65);
      lunarLight.position.set(-18, 24, 16);
      lunarLight.castShadow = true;
      lunarLight.shadow.mapSize.set(1024, 1024);
      lunarLight.shadow.camera.left = -30;
      lunarLight.shadow.camera.right = 30;
      lunarLight.shadow.camera.top = 28;
      lunarLight.shadow.camera.bottom = -20;
      lunarLight.shadow.camera.near = 1;
      lunarLight.shadow.camera.far = 100;
      scene.add(lunarLight);

      var bayLight = new THREE.SpotLight(0x8cefe8, 120, 92, Math.PI * 0.22, 0.7, 1.5);
      bayLight.position.set(0, 13, 17);
      bayLight.target.position.set(0, 0, -26);
      bayLight.castShadow = true;
      bayLight.shadow.mapSize.set(1024, 1024);
      scene.add(bayLight, bayLight.target);

      var doorLight = new THREE.SpotLight(0xff8f2a, 90, 65, Math.PI * 0.24, 0.85, 1.5);
      doorLight.position.set(0, 10, -64);
      doorLight.target.position.set(0, 0, -34);
      scene.add(doorLight, doorLight.target);

      var drones = [];
      var deltaPositions = [
        new THREE.Vector3(0, 5.4, -20),
        new THREE.Vector3(-4.4, 4.6, -14),
        new THREE.Vector3(4.4, 4.6, -14),
        new THREE.Vector3(-8.2, 5.2, -7),
        new THREE.Vector3(8.2, 5.2, -7),
        new THREE.Vector3(0, 7.4, -7)
      ];

      function makeDrone(index) {
        var drone = new THREE.Group();

        var hull = new THREE.Mesh(new THREE.OctahedronGeometry(1.15, 1), darkMetal);
        hull.scale.set(1.45, 0.48, 0.86);
        hull.castShadow = true;
        hull.receiveShadow = true;
        drone.add(hull);

        var spine = box(2.8, 0.15, 0.48, edgeMetal, 0, 0.05, 0);
        spine.castShadow = true;
        drone.add(spine);

        var visor = box(1.15, 0.22, 0.12, blackGlass, 0, 0.08, 0.79);
        drone.add(visor);
        var visorLight = box(0.68, 0.06, 0.04, cyanGlow.clone(), 0, 0.08, 0.86);
        drone.add(visorLight);

        var armMaterial = darkMetal;
        var rotors = [];
        [-1, 1].forEach(function (sideSign) {
          var arm = box(1.25, 0.12, 0.14, armMaterial, sideSign * 1.62, 0, 0);
          drone.add(arm);

          var pod = cylinder(0.4, 0.34, 0.24, 16, edgeMetal);
          pod.position.set(sideSign * 2.2, 0.02, 0);
          drone.add(pod);

          var ring = new THREE.Mesh(
            new THREE.TorusGeometry(0.58, 0.055, 8, 32),
            cyanGlow.clone()
          );
          ring.rotation.x = Math.PI / 2;
          ring.position.set(sideSign * 2.2, 0.03, 0);
          drone.add(ring);

          var rotor = new THREE.Group();
          rotor.position.set(sideSign * 2.2, 0.14, 0);
          rotor.add(box(1.0, 0.025, 0.06, edgeMetal));
          rotor.add(box(0.06, 0.025, 1.0, edgeMetal));
          drone.add(rotor);
          rotors.push(rotor);
        });

        var coreMaterial = amberGlow.clone();
        var core = new THREE.Mesh(new THREE.SphereGeometry(0.18, 12, 8), coreMaterial);
        core.position.set(0, -0.42, 0.12);
        drone.add(core);

        var downLight = new THREE.SpotLight(0x43ead7, 8, 7, Math.PI * 0.19, 0.8, 2);
        downLight.position.set(0, -0.36, 0);
        downLight.target.position.set(0, -3, 0);
        drone.add(downLight, downLight.target);

        var tag = makeLabel("D-" + String(index + 1).padStart(2, "0"), "#84fff0", 1.85);
        tag.position.set(0, 0.82, 0);
        tag.material.opacity = 0.52;
        drone.add(tag);

        drone.position.copy(deltaPositions[index]);
        drone.userData = {
          index: index,
          phase: index * 1.17,
          velocity: new THREE.Vector3(),
          current: deltaPositions[index].clone(),
          target: deltaPositions[index].clone(),
          rotors: rotors,
          core: core,
          visor: visorLight
        };

        scene.add(drone);
        drones.push(drone);
      }

      for (var droneIndex = 0; droneIndex < 6; droneIndex++) {
        makeDrone(droneIndex);
      }

      function makeFogTexture(seed) {
        var canvas = document.createElement("canvas");
        canvas.width = 256;
        canvas.height = 256;
        var context = canvas.getContext("2d");
        var random = function () {
          seed = (seed * 9301 + 49297) % 233280;
          return seed / 233280;
        };
        context.clearRect(0, 0, 256, 256);
        for (var cloud = 0; cloud < 42; cloud++) {
          var x = random() * 256;
          var y = random() * 256;
          var radius = 18 + random() * 62;
          var gradient = context.createRadialGradient(x, y, 0, x, y, radius);
          gradient.addColorStop(0, "rgba(255,255,255," + (0.08 + random() * 0.1) + ")");
          gradient.addColorStop(1, "rgba(255,255,255,0)");
          context.fillStyle = gradient;
          context.fillRect(x - radius, y - radius, radius * 2, radius * 2);
        }
        var texture = new THREE.CanvasTexture(canvas);
        texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
        texture.repeat.set(1.7, 3.8);
        return texture;
      }

      var fogPlanes = [];
      for (var fogIndex = 0; fogIndex < 7; fogIndex++) {
        var fogTexture = makeFogTexture(19 + fogIndex * 23);
        var fogMaterial = new THREE.MeshBasicMaterial({
          map: fogTexture,
          color: fogIndex % 3 === 0 ? 0x65d8db : 0xb3d9d8,
          transparent: true,
          opacity: 0.025 + fogIndex * 0.003,
          blending: THREE.AdditiveBlending,
          depthWrite: false,
          side: THREE.DoubleSide
        });
        var fogPlane = new THREE.Mesh(new THREE.PlaneGeometry(43, 84), fogMaterial);
        fogPlane.rotation.x = -Math.PI / 2 + (fogIndex - 3) * 0.007;
        fogPlane.rotation.z = fogIndex * 0.29;
        fogPlane.position.set((fogIndex % 2 ? 1 : -1) * fogIndex * 0.4, 0.32 + fogIndex * 0.38, -20);
        fogPlane.userData = {
          speedX: 0.003 + fogIndex * 0.0007,
          speedY: 0.0015 + fogIndex * 0.0004,
          baseOpacity: fogMaterial.opacity,
          phase: fogIndex
        };
        fogPlanes.push(fogPlane);
        scene.add(fogPlane);
      }

      var dustCount = 650;
      var dustPositions = new Float32Array(dustCount * 3);
      for (var dustIndex = 0; dustIndex < dustCount; dustIndex++) {
        dustPositions[dustIndex * 3] = (Math.random() - 0.5) * 42;
        dustPositions[dustIndex * 3 + 1] = Math.random() * 12;
        dustPositions[dustIndex * 3 + 2] = 34 - Math.random() * 98;
      }
      var dustGeometry = new THREE.BufferGeometry();
      dustGeometry.setAttribute("position", new THREE.BufferAttribute(dustPositions, 3));
      var dustMaterial = new THREE.PointsMaterial({
        color: 0x9fd8d3,
        size: 0.035,
        transparent: true,
        opacity: 0.32,
        depthWrite: false,
        blending: THREE.AdditiveBlending
      });
      var dust = new THREE.Points(dustGeometry, dustMaterial);
      scene.add(dust);

      var cameraCurve = new THREE.CatmullRomCurve3([
        new THREE.Vector3(0, 8.4, 32),
        new THREE.Vector3(-13.5, 6.2, 17),
        new THREE.Vector3(-12, 4.5, -5),
        new THREE.Vector3(-3, 6.8, -27),
        new THREE.Vector3(12, 7.8, -18),
        new THREE.Vector3(14, 5.5, 4),
        new THREE.Vector3(8, 9.8, 24)
      ], true, "catmullrom", 0.35);

      var lookCurve = new THREE.CatmullRomCurve3([
        new THREE.Vector3(0, 4.8, -10),
        new THREE.Vector3(-3, 4.8, -13),
        new THREE.Vector3(0, 5.2, -18),
        new THREE.Vector3(3, 4.5, -21),
        new THREE.Vector3(0, 5, -15),
        new THREE.Vector3(-2, 5.8, -9),
        new THREE.Vector3(0, 5, -12)
      ], true, "catmullrom", 0.45);

      var cameraTarget = new THREE.Vector3();
      var cameraLook = new THREE.Vector3();

      function setFormation(next) {
        formation = next;
        formationLabel.textContent = "Formation: " + (formation === "delta" ? "Delta" : "Orbit");
        formationButton.classList.add("active");
        window.setTimeout(function () {
          formationButton.classList.remove("active");
        }, 650);
      }

      function setCinematic(next) {
        cinematic = next;
        cinemaButton.classList.toggle("active", cinematic);
        cinemaButton.setAttribute("aria-pressed", String(cinematic));
        cinemaLabel.textContent = cinematic ? "Exit cinematic" : "Run cinematic";
        cameraMode.textContent = cinematic ? "Cine / A" : "Manual / P";
        if (cinematic) {
          cinematicStart = performance.now();
        }
      }

      formationButton.addEventListener("click", function () {
        setFormation(formation === "delta" ? "orbit" : "delta");
      });

      cinemaButton.addEventListener("click", function () {
        setCinematic(!cinematic);
      });

      window.addEventListener("pointermove", function (event) {
        pointer.x = event.clientX / window.innerWidth * 2 - 1;
        pointer.y = -(event.clientY / window.innerHeight * 2 - 1);
      }, { passive: true });

      window.addEventListener("keydown", function (event) {
        if (event.key.toLowerCase() === "f") {
          setFormation(formation === "delta" ? "orbit" : "delta");
        }
        if (event.key.toLowerCase() === "c") {
          setCinematic(!cinematic);
        }
      });

      function resize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.75));
        renderer.setSize(window.innerWidth, window.innerHeight);
      }
      window.addEventListener("resize", resize, { passive: true });

      function updateDrones(time, delta) {
        drones.forEach(function (drone, index) {
          var data = drone.userData;
          if (formation === "delta") {
            data.target.copy(deltaPositions[index]);
          } else {
            var radius = index < 3 ? 5.6 : 9.3;
            var angle = time * (index < 3 ? 0.19 : -0.13) + index * Math.PI * 2 / 3;
            data.target.set(
              Math.cos(angle) * radius,
              4.5 + (index % 3) * 1.2 + Math.sin(time * 0.8 + data.phase) * 0.35,
              -13 + Math.sin(angle) * radius * 0.72
            );
          }

          var previousX = data.current.x;
          var previousZ = data.current.z;
          var damping = 1 - Math.exp(-delta * 1.55);
          data.current.lerp(data.target, damping);
          data.velocity.set(data.current.x - previousX, 0, data.current.z - previousZ);

          var hover = Math.sin(time * 1.65 + data.phase) * 0.2;
          drone.position.copy(data.current);
          drone.position.y += hover;
          drone.rotation.z = THREE.MathUtils.lerp(drone.rotation.z, -data.velocity.x * 1.8, 0.08);
          drone.rotation.x = THREE.MathUtils.lerp(drone.rotation.x, data.velocity.z * 1.5 + Math.sin(time + data.phase) * 0.025, 0.08);
          drone.rotation.y = Math.sin(time * 0.25 + data.phase) * 0.08;

          data.rotors.forEach(function (rotor, rotorIndex) {
            rotor.rotation.y += delta * (rotorIndex ? -18 : 18);
          });
          data.core.material.emissiveIntensity = 3.1 + Math.sin(time * 3 + data.phase) * 1.3;
          data.visor.material.emissiveIntensity = 2.4 + Math.sin(time * 1.8 + data.phase) * 0.6;
        });
      }

      function updateLighting(time) {
        warningLights.forEach(function (assembly) {
          var pulse = Math.pow(Math.max(0, Math.sin(time * 2.8 + assembly.userData.phase)), 8);
          assembly.userData.bulb.material.emissiveIntensity = 0.5 + pulse * 7;
          assembly.userData.light.intensity = pulse * 24;
        });

        runwayMaterials.forEach(function (material, index) {
          material.emissiveIntensity = 2.4 + Math.max(0, Math.sin(time * 2.1 - index * 0.48)) * 1.6;
        });

        amberGlow.emissiveIntensity = 3.2 + Math.sin(time * 2.4) * 0.65;
        bayLight.intensity = 110 + Math.sin(time * 0.65) * 10;
      }

      function updateFog(time, delta) {
        fogPlanes.forEach(function (plane) {
          var data = plane.userData;
          plane.material.map.offset.x += data.speedX * delta * 10;
          plane.material.map.offset.y += data.speedY * delta * 10;
          plane.material.opacity = data.baseOpacity * (0.82 + Math.sin(time * 0.34 + data.phase) * 0.18);
          plane.position.x += Math.sin(time * 0.07 + data.phase) * delta * 0.018;
        });
        dust.rotation.y = Math.sin(time * 0.055) * 0.025;
        dust.position.y = Math.sin(time * 0.11) * 0.2;
      }

      function updateCamera(time, now) {
        if (cinematic && !reducedMotion) {
          var progress = ((now - cinematicStart) % cinematicDuration) / cinematicDuration;
          var eased = progress < 0.5
            ? 2 * progress * progress
            : 1 - Math.pow(-2 * progress + 2, 2) / 2;
          cameraCurve.getPointAt(eased, cameraTarget);
          lookCurve.getPointAt(eased, cameraLook);
          camera.position.copy(cameraTarget);
          camera.lookAt(cameraLook);
          cinemaProgress.style.setProperty("--progress", progress.toFixed(4));
          coordinate.textContent = "PATH " + String(Math.floor(progress * 100)).padStart(3, "0") + "% / LUNA H17";
        } else {
          cameraTarget.set(pointer.x * 2.8, 8.2 + pointer.y * 1.1, 31.5 + Math.abs(pointer.x) * 0.9);
          camera.position.lerp(cameraTarget, 0.032);
          cameraLook.set(pointer.x * 1.8, 4.8 + pointer.y * 0.55, -14);
          camera.lookAt(cameraLook);
          cinemaProgress.style.setProperty("--progress", "0");
          coordinate.textContent = "AZ " + (17.04 + pointer.x * 2.2).toFixed(2) + " / EL " + (8.32 + pointer.y).toFixed(2);
        }
      }

      var lastTimeText = "";
      function updateClock() {
        var current = new Date();
        var text = current.toLocaleTimeString("en-NZ", {
          hour12: false,
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit"
        });
        if (text !== lastTimeText) {
          localTime.textContent = text;
          lastTimeText = text;
        }
      }

      function animate(now) {
        var delta = Math.min(clock.getDelta(), 0.05);
        var time = clock.elapsedTime;

        updateDrones(time, delta);
        updateLighting(time);
        updateFog(time, delta);
        updateCamera(time, now);
        updateClock();

        renderer.render(scene, camera);
        requestAnimationFrame(animate);
      }

      renderer.compile(scene, camera);
      updateClock();
      window.setTimeout(function () {
        boot.classList.add("ready");
      }, 850);
      requestAnimationFrame(animate);
    }());
  </script>
</body>
</html>
