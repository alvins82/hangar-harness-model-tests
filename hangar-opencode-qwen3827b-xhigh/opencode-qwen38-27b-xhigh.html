<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#04060b" />
<title>HANGAR 07 — Drone Bay</title>
<style>
  :root { --cyan: #35e0ff; --amber: #ffb454; --red: #ff3344; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #04060b; }
  body { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  canvas { display: block; }

  #hud { position: fixed; top: 18px; left: 18px; z-index: 10; color: #bfe8ff; user-select: none; }
  .panel {
    border: 1px solid rgba(53, 224, 255, .28);
    background: linear-gradient(180deg, rgba(6,12,20,.82), rgba(4,8,14,.66));
    padding: 14px 16px 12px;
    backdrop-filter: blur(6px);
    box-shadow: 0 0 24px rgba(0,0,0,.5), inset 0 0 18px rgba(53,224,255,.05);
  }
  .title { font-size: 13px; letter-spacing: .32em; color: var(--cyan); text-shadow: 0 0 12px rgba(53,224,255,.55); margin-bottom: 10px; }
  .title span { color: #5f7f95; letter-spacing: .18em; font-size: 10px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  button {
    font: inherit; font-size: 10px; letter-spacing: .14em;
    color: #bfe8ff; background: rgba(10,20,32,.6);
    border: 1px solid rgba(53,224,255,.35);
    padding: 7px 10px; cursor: pointer;
    transition: background .18s ease, border-color .18s ease, box-shadow .18s ease;
  }
  button:hover { background: rgba(53,224,255,.14); border-color: var(--cyan); box-shadow: 0 0 14px rgba(53,224,255,.35); }
  button.on { background: rgba(53,224,255,.2); border-color: var(--cyan); color: #eaffff; box-shadow: 0 0 16px rgba(53,224,255,.45); }
  button.alert.on { background: rgba(255,51,68,.2); border-color: var(--red); color: #ffd7db; box-shadow: 0 0 16px rgba(255,51,68,.5); }
  #status { margin-top: 10px; font-size: 9.5px; letter-spacing: .22em; color: #5f8aa5; }
  #status b { color: #9fd6f0; font-weight: 400; }

  #hint {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
    z-index: 10; font-size: 9.5px; letter-spacing: .24em; color: #44607a;
    text-transform: uppercase; white-space: nowrap;
  }
  #vignette { position: fixed; inset: 0; z-index: 5; pointer-events: none;
    background: radial-gradient(ellipse at 50% 45%, transparent 55%, rgba(0,0,0,.55) 100%); }
  #scan { position: fixed; inset: 0; z-index: 6; pointer-events: none; opacity: .05;
    background: repeating-linear-gradient(0deg, #9fd6ff 0 1px, transparent 1px 3px); }
</style>
</head>
<body>
<div id="vignette"></div>
<div id="scan"></div>
<div id="hud">
  <div class="panel">
    <div class="title">HANGAR 07 <span>// DRONE BAY</span></div>
    <div class="row">
      <button id="btnFormation">FORMATION · LINE</button>
      <button id="btnCamera">CAMERA · ORBIT</button>
      <button id="btnAlert" class="alert">ALERT · OFF</button>
    </div>
    <div id="status">BOOTING…</div>
  </div>
</div>
<div id="hint">drag · orbit &nbsp;&nbsp; scroll · zoom &nbsp;&nbsp; cinematic · auto sweep</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ============================== basics ============================== */

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x04060b);
scene.fog = new THREE.FogExp2(0x05080e, 0.014);

const camera = new THREE.PerspectiveCamera(58, innerWidth / innerHeight, 0.1, 200);
camera.position.set(0, 3.4, 21);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 2.2, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 3;
controls.maxDistance = 19;
controls.maxPolarAngle = Math.PI * 0.495;

/* ============================== helpers ============================== */

function canvasTex(w, h, draw) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}

function radialTex(size, inner, outer) {
  return canvasTex(size, size, (g) => {
    const grd = g.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
    grd.addColorStop(0, inner);
    grd.addColorStop(1, outer);
    g.fillStyle = grd;
    g.fillRect(0, 0, size, size);
  });
}

const glowTex = radialTex(128, 'rgba(255,255,255,1)', 'rgba(255,255,255,0)');

function panelTexture(w, h, cell, base, line, accent) {
  return canvasTex(w, h, (g) => {
    g.fillStyle = base; g.fillRect(0, 0, w, h);
    for (let x = 0; x < w; x += cell) for (let y = 0; y < h; y += cell) {
      if (Math.random() < 0.5) continue;
      const v = 8 + Math.random() * 14;
      g.fillStyle = `rgba(${v | 0},${(v * 1.5) | 0},${(v * 2.2) | 0},0.35)`;
      g.fillRect(x + 2, y + 2, cell - 4, cell - 4);
    }
    g.strokeStyle = line; g.lineWidth = 2;
    for (let x = 0; x <= w; x += cell) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, h); g.stroke(); }
    for (let y = 0; y <= h; y += cell) { g.beginPath(); g.moveTo(0, y); g.lineTo(w, y); g.stroke(); }
    g.fillStyle = accent;
    for (let x = cell / 2; x < w; x += cell) for (let y = cell / 2; y < h; y += cell) {
      g.beginPath(); g.arc(x, y, 1.6, 0, Math.PI * 2); g.fill();
    }
  });
}

function box(w, h, d, mat, x, y, z) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z);
  scene.add(m);
  return m;
}

/* ============================== hangar shell ============================== */

const floorTex = panelTexture(1024, 1024, 64, '#0a0e15', '#15202e', 'rgba(140,190,230,0.14)');
floorTex.wrapS = floorTex.wrapT = THREE.RepeatWrapping;
floorTex.repeat.set(3, 4);
const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(48, 68),
  new THREE.MeshStandardMaterial({ map: floorTex, color: 0xbfd0e0, metalness: 0.25, roughness: 0.6 })
);
floor.rotation.x = -Math.PI / 2;
scene.add(floor);

const wallTex = panelTexture(1024, 512, 128, '#080c12', '#111a26', 'rgba(120,170,210,0.10)');
wallTex.wrapS = wallTex.wrapT = THREE.RepeatWrapping;
function wallMatFor(rx, ry) {
  const m = new THREE.MeshStandardMaterial({ color: 0x9fb2c8, metalness: 0.3, roughness: 0.55 });
  const t = wallTex.clone();
  t.repeat.set(rx, ry);
  m.map = t;
  return m;
}
const wallBack = box(48, 14, 0.8, wallMatFor(4, 2), 0, 7, -34.4);
const wallFront = box(48, 14, 0.8, wallMatFor(4, 2), 0, 7, 34.4);
const wallLeft = box(0.8, 14, 68, wallMatFor(5, 2), -24.4, 7, 0);
const wallRight = box(0.8, 14, 68, wallMatFor(5, 2), 24.4, 7, 0);

const ceiling = new THREE.Mesh(
  new THREE.PlaneGeometry(48, 68),
  new THREE.MeshStandardMaterial({ color: 0x05070c, metalness: 0.2, roughness: 0.9 })
);
ceiling.rotation.x = Math.PI / 2;
ceiling.position.y = 14;
scene.add(ceiling);

const steel = new THREE.MeshStandardMaterial({ color: 0x3a4658, metalness: 0.75, roughness: 0.35 });
const steelDark = new THREE.MeshStandardMaterial({ color: 0x1c2430, metalness: 0.6, roughness: 0.5 });
for (const z of [-26, -13, 0, 13, 26]) box(48, 0.7, 1.0, steel, 0, 13.4, z);
for (const x of [-12, 12]) box(0.6, 0.7, 68, steelDark, x, 13.8, 0);
for (const [x, z] of [[-22, -32], [22, -32], [-22, 32], [22, 32]]) box(1, 14, 1, steelDark, x, 7, z);

const barMat = new THREE.MeshStandardMaterial({ color: 0x0b0f14, emissive: 0xbfe8ff, emissiveIntensity: 0.9 });
for (const z of [-20, 0, 20]) box(30, 0.25, 0.8, barMat, 0, 13.2, z);

const stripMat = new THREE.MeshStandardMaterial({ color: 0x06121c, emissive: 0x19c8ff, emissiveIntensity: 0.6 });
box(0.06, 0.12, 68, stripMat, -23.9, 3.4, 0);
box(0.06, 0.12, 68, stripMat, 23.9, 3.4, 0);
box(48, 0.12, 0.06, stripMat, 0, 3.4, -33.9);
box(48, 0.12, 0.06, stripMat, 0, 3.4, 33.9);

/* hangar door on the back wall */
const doorTex = canvasTex(1024, 1024, (g) => {
  g.fillStyle = '#070b11'; g.fillRect(0, 0, 1024, 1024);
  g.strokeStyle = '#101a28'; g.lineWidth = 3;
  for (let y = 0; y <= 1024; y += 128) { g.beginPath(); g.moveTo(0, y); g.lineTo(1024, y); g.stroke(); }
  g.strokeStyle = 'rgba(53,224,255,0.8)'; g.lineWidth = 6;
  g.beginPath(); g.arc(512, 430, 210, 0, Math.PI * 2); g.stroke();
  g.lineWidth = 2;
  g.beginPath(); g.arc(512, 430, 160, 0, Math.PI * 2); g.stroke();
  g.fillStyle = 'rgba(53,224,255,0.95)';
  g.font = '700 150px monospace'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText('07', 512, 430);
  g.font = '400 34px monospace'; g.fillStyle = 'rgba(120,190,230,0.8)';
  g.fillText('D R O N E   B A Y', 512, 700);
  g.save();
  g.beginPath(); g.rect(0, 900, 1024, 124); g.clip();
  g.fillStyle = '#111318'; g.fillRect(0, 900, 1024, 124);
  g.fillStyle = '#ffb454';
  for (let x = -124; x < 1024; x += 124) {
    g.beginPath();
    g.moveTo(x, 1024); g.lineTo(x + 62, 900); g.lineTo(x + 124, 900); g.lineTo(x + 62, 1024);
    g.closePath(); g.fill();
  }
  g.restore();
});
const door = new THREE.Mesh(new THREE.PlaneGeometry(22, 13), new THREE.MeshBasicMaterial({ map: doorTex }));
door.position.set(0, 7, -33.95);
scene.add(door);

/* ============================== lighting ============================== */

scene.add(new THREE.AmbientLight(0x33465e, 0.4));
scene.add(new THREE.HemisphereLight(0x3a5570, 0x0a0d12, 0.55));
const keyLight = new THREE.PointLight(0x8fd8ff, 90, 0, 2);
keyLight.position.set(0, 11, 0);
scene.add(keyLight);
const cyanFront = new THREE.PointLight(0x19d3ff, 50, 0, 2);
cyanFront.position.set(0, 3, 22);
scene.add(cyanFront);
const cyanBack = new THREE.PointLight(0x19d3ff, 50, 0, 2);
cyanBack.position.set(0, 3, -22);
scene.add(cyanBack);
const amberWarm = new THREE.PointLight(0xffb454, 40, 0, 2);
amberWarm.position.set(15, 6, 8);
scene.add(amberWarm);

/* ============================== runway ============================== */

const C_CYAN = new THREE.Color(0x35e0ff);
const C_AMBER = new THREE.Color(0xffb454);
const C_RED = new THREE.Color(0xff2233);

const runCenterMat = new THREE.MeshStandardMaterial({ color: 0x03181f, emissive: 0x19d3ff, emissiveIntensity: 1.1 });
const runEdgeMat = new THREE.MeshStandardMaterial({ color: 0x1a0f02, emissive: 0xffb454, emissiveIntensity: 0.9 });
const runEdgeBaseA = new THREE.Color(0x1a0f02);
const runEdgeBaseR = new THREE.Color(0x200608);
box(1.4, 0.1, 52, runCenterMat, 0, 0.05, 0);
box(0.45, 0.08, 52, runEdgeMat, -5.5, 0.04, 0);
box(0.45, 0.08, 52, runEdgeMat, 5.5, 0.04, 0);

/* chevrons at both runway ends */
const chevTex = canvasTex(256, 256, (g) => {
  g.clearRect(0, 0, 256, 256);
  g.lineCap = 'round';
  g.strokeStyle = 'rgba(80,230,255,0.35)'; g.lineWidth = 46;
  g.beginPath(); g.moveTo(60, 50); g.lineTo(185, 128); g.lineTo(60, 206); g.stroke();
  g.strokeStyle = 'rgba(140,240,255,1)'; g.lineWidth = 22;
  g.beginPath(); g.moveTo(60, 50); g.lineTo(185, 128); g.lineTo(60, 206); g.stroke();
});
const chevMat = new THREE.MeshBasicMaterial({
  map: chevTex, transparent: true, opacity: 0.8,
  depthWrite: false, side: THREE.DoubleSide, toneMapped: false
});
for (const end of [1, -1]) {
  const ch = new THREE.Mesh(new THREE.PlaneGeometry(4.5, 4.5), chevMat);
  ch.rotation.x = -Math.PI / 2;
  ch.rotateY(end * Math.PI / 2);
  ch.position.set(0, 0.03, end * 27.5);
  scene.add(ch);
}

/* landing pad ring */
const padMat = new THREE.MeshStandardMaterial({ color: 0x04141c, emissive: 0x19d3ff, emissiveIntensity: 1.0 });
const pad = new THREE.Mesh(new THREE.TorusGeometry(4.8, 0.07, 10, 72), padMat);
pad.rotation.x = Math.PI / 2;
pad.position.y = 0.05;
scene.add(pad);
for (let i = 0; i < 12; i++) {
  const a = (i / 12) * Math.PI * 2;
  const tick = box(0.5, 0.04, 0.1, padMat, Math.cos(a) * 4.8, 0.04, Math.sin(a) * 4.8);
  tick.rotation.y = -a;
}

/* moving pulse traveling down the center strip */
const pulseMat = new THREE.MeshBasicMaterial({ color: 0x7df3ff, transparent: true, opacity: 0.9, toneMapped: false });
const pulse = box(1.7, 0.14, 1.4, pulseMat, 0, 0.1, 0);
const pulseGlow = new THREE.Sprite(new THREE.SpriteMaterial({
  map: glowTex, color: 0x35e0ff, transparent: true, opacity: 0.5,
  blending: THREE.AdditiveBlending, depthWrite: false
}));
pulseGlow.scale.set(4, 2.2, 1);
scene.add(pulseGlow);

/* ============================== beacons ============================== */

const beacons = [];
function makeBeacon(x, z) {
  const g = new THREE.Group();
  g.position.set(x, 0, z);
  const post = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.22, 2.2, 10), steelDark);
  post.position.y = 1.1;
  g.add(post);
  const capMat = new THREE.MeshStandardMaterial({ color: 0x1a1214, emissive: 0xff3344, emissiveIntensity: 0.2 });
  const cap = new THREE.Mesh(new THREE.SphereGeometry(0.32, 18, 14), capMat);
  cap.position.y = 2.3;
  g.add(cap);
  const light = new THREE.PointLight(0xff3344, 0, 0, 2);
  light.position.y = 2.4;
  g.add(light);
  const beamMat = new THREE.MeshBasicMaterial({
    color: 0x35e0ff, transparent: true, opacity: 0.05,
    blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide
  });
  const beam = new THREE.Mesh(new THREE.ConeGeometry(1.15, 2.3, 20, 1, true), beamMat);
  beam.position.y = 1.15;
  g.add(beam);
  const glow = new THREE.Sprite(new THREE.SpriteMaterial({
    map: glowTex, color: 0x35e0ff, transparent: true, opacity: 0.4,
    blending: THREE.AdditiveBlending, depthWrite: false
  }));
  glow.scale.set(2.6, 2.6, 1);
  glow.position.y = 2.4;
  g.add(glow);
  const ringFloor = new THREE.Mesh(new THREE.TorusGeometry(0.9, 0.03, 8, 32), capMat);
  ringFloor.rotation.x = Math.PI / 2;
  ringFloor.position.y = 0.04;
  g.add(ringFloor);
  scene.add(g);
  beacons.push({ g, capMat, light, beamMat, beam, glow, ringFloor, phase: Math.random() * 6.28 });
}
for (const [x, z] of [[-16, -20], [16, -20], [-16, 20], [16, 20]]) makeBeacon(x, z);

/* ============================== fog planes ============================== */

const fogTex = radialTex(256, 'rgba(255,255,255,0.85)', 'rgba(255,255,255,0)');
const fogs = [];
for (let i = 0; i < 5; i++) {
  const m = new THREE.Mesh(
    new THREE.PlaneGeometry(16 + i * 2.5, 16 + i * 2.5),
    new THREE.MeshBasicMaterial({ map: fogTex, color: i % 2 ? 0x9fb8cc : 0x7f95a8, transparent: true, opacity: 0.05, depthWrite: false })
  );
  m.rotation.x = -Math.PI / 2;
  m.position.set((Math.random() - 0.5) * 36, 0.25 + i * 0.22, (Math.random() - 0.5) * 52);
  m.userData = {
    baseOp: 0.05 + i * 0.013,
    spin: (Math.random() - 0.5) * 0.06,
    drift: (Math.random() - 0.5) * 0.4,
    phase: Math.random() * 6.28
  };
  scene.add(m);
  fogs.push(m);
}
for (const [x, z, ry, axis] of [[-21, -8, Math.PI / 2, 'z'], [21, 4, -Math.PI / 2, 'z'], [0, -29, 0, 'x'], [8, 25, Math.PI / 2, 'z']]) {
  const m = new THREE.Mesh(
    new THREE.PlaneGeometry(14, 5),
    new THREE.MeshBasicMaterial({ map: fogTex, color: 0x88a0b8, transparent: true, opacity: 0.045, depthWrite: false, side: THREE.DoubleSide })
  );
  m.position.set(x, 2.2, z);
  m.rotation.y = ry;
  m.userData = {
    baseOp: 0.045,
    phase: Math.random() * 6.28,
    [axis]: (Math.random() - 0.5) * 0.3
  };
  scene.add(m);
  fogs.push(m);
}

/* ============================== dust ============================== */

const DUST = 450;
const dustGeo = new THREE.BufferGeometry();
const dustPos = new Float32Array(DUST * 3);
const dustVel = new Float32Array(DUST);
for (let i = 0; i < DUST; i++) {
  dustPos[i * 3] = (Math.random() - 0.5) * 40;
  dustPos[i * 3 + 1] = 0.3 + Math.random() * 12;
  dustPos[i * 3 + 2] = (Math.random() - 0.5) * 56;
  dustVel[i] = 0.15 + Math.random() * 0.3;
}
dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
const dust = new THREE.Points(dustGeo, new THREE.PointsMaterial({
  color: 0x5f7f9a, size: 0.05, transparent: true, opacity: 0.4, depthWrite: false
}));
scene.add(dust);

/* ============================== drones ============================== */

const N = 9;
const droneBodyMat = new THREE.MeshStandardMaterial({ color: 0x333e4e, metalness: 0.75, roughness: 0.3 });
const rotorDiscMat = new THREE.MeshStandardMaterial({
  color: 0x0a1118, transparent: true, opacity: 0.5,
  emissive: 0x1f88aa, emissiveIntensity: 0.5, depthWrite: false
});
const bladeMat = new THREE.MeshStandardMaterial({ color: 0xa8bdd2, metalness: 0.6, roughness: 0.35, transparent: true, opacity: 0.75 });

function buildDrone() {
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.16, 0.68), droneBodyMat);
  g.add(body);
  const nose = new THREE.Mesh(new THREE.ConeGeometry(0.14, 0.22, 12), droneBodyMat);
  nose.rotation.x = Math.PI / 2;
  nose.position.set(0, 0, 0.45);
  g.add(nose);
  const dome = new THREE.Mesh(
    new THREE.SphereGeometry(0.13, 16, 12),
    new THREE.MeshStandardMaterial({ color: 0x05131c, emissive: 0x35e0ff, emissiveIntensity: 1.5, roughness: 0.15, metalness: 0.4 })
  );
  dome.position.set(0, 0.12, 0.1);
  g.add(dome);
  const ring = new THREE.Mesh(
    new THREE.TorusGeometry(0.34, 0.028, 8, 28),
    new THREE.MeshStandardMaterial({ color: 0x0a1218, emissive: 0x19c8ff, emissiveIntensity: 1.1 })
  );
  ring.rotation.x = Math.PI / 2;
  ring.position.y = -0.06;
  g.add(ring);

  const rotors = [];
  for (const [ax, az] of [[0.34, 0.42], [-0.34, 0.42], [0.34, -0.42], [-0.34, -0.42]]) {
    const arm = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.05, 0.07), droneBodyMat);
    arm.position.set(ax * 0.75, 0, az * 0.75);
    arm.rotation.y = Math.atan2(-az, ax);
    g.add(arm);
    const rotor = new THREE.Group();
    rotor.position.set(ax, 0.05, az);
    const disc = new THREE.Mesh(new THREE.CylinderGeometry(0.26, 0.26, 0.012, 20), rotorDiscMat);
    rotor.add(disc);
    const b1 = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.015, 0.05), bladeMat);
    rotor.add(b1);
    const b2 = b1.clone();
    b2.rotation.y = Math.PI / 2;
    rotor.add(b2);
    g.add(rotor);
    rotors.push({ r: rotor, speed: (Math.random() < 0.5 ? -1 : 1) * (16 + Math.random() * 6) });
  }
  const nav = new THREE.Mesh(
    new THREE.SphereGeometry(0.045, 8, 8),
    new THREE.MeshStandardMaterial({ color: 0x1a0f02, emissive: 0xffb454, emissiveIntensity: 1 })
  );
  nav.position.set(0, 0.02, 0.5);
  g.add(nav);
  const glow = new THREE.Sprite(new THREE.SpriteMaterial({
    map: glowTex, color: 0x22c8ff, transparent: true, opacity: 0.35,
    blending: THREE.AdditiveBlending, depthWrite: false
  }));
  glow.scale.set(1.5, 1.5, 1);
  glow.position.y = -0.12;
  g.add(glow);
  g.userData = { rotors, dome, nav, glow };
  return g;
}

function formationPositions(name, n) {
  const pts = [];
  if (name === 'LINE') {
    for (let i = 0; i < n; i++) pts.push(new THREE.Vector3((i - (n - 1) / 2) * 2.8, 0, 0));
  } else if (name === 'V') {
    pts.push(new THREE.Vector3(0, 0, 5));
    for (let i = 1; i < n; i++) {
      const k = Math.ceil(i / 2);
      const side = (i % 2 === 1) ? -1 : 1;
      pts.push(new THREE.Vector3(side * 2.4 * k, 0, 5 - 2.6 * k));
    }
  } else if (name === 'GRID') {
    for (let i = 0; i < n; i++) {
      const c = i % 3, r = (i / 3) | 0;
      pts.push(new THREE.Vector3((c - 1) * 3.6, 0, (r - 1) * 3.6));
    }
  } else if (name === 'RING') {
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2;
      pts.push(new THREE.Vector3(Math.cos(a) * 5.4, 0, Math.sin(a) * 5.4));
    }
  } else {
    for (let i = 0; i < n; i++) {
      const f = i / (n - 1);
      const a = f * Math.PI * 3.5;
      const r = 1 + f * 4.8;
      pts.push(new THREE.Vector3(Math.cos(a) * r, 0, Math.sin(a) * r));
    }
  }
  return pts;
}

const drones = [];
for (let i = 0; i < N; i++) {
  const g = buildDrone();
  const a = Math.random() * Math.PI * 2;
  g.position.set(Math.cos(a) * (6 + Math.random() * 8), 1.6 + Math.random(), Math.sin(a) * (6 + Math.random() * 8));
  scene.add(g);
  drones.push({
    g,
    ph: Math.random() * 6.28,
    h: 1.5 + Math.random() * 0.9,
    px: g.position.x,
    pz: g.position.z
  });
}

/* floor rings marking formation targets */
const targetRings = [];
for (let i = 0; i < N; i++) {
  const r = new THREE.Mesh(
    new THREE.TorusGeometry(0.5, 0.02, 6, 28),
    new THREE.MeshBasicMaterial({ color: 0x35e0ff, transparent: true, opacity: 0.3, blending: THREE.AdditiveBlending, depthWrite: false })
  );
  r.rotation.x = Math.PI / 2;
  r.position.y = 0.05;
  scene.add(r);
  targetRings.push(r);
}

/* ============================== cinematic camera ============================== */

const camPath = new THREE.CatmullRomCurve3([
  new THREE.Vector3(  0.0, 3.0, 26.0),
  new THREE.Vector3( 12.0, 3.8, 17.0),
  new THREE.Vector3( 18.0, 5.2,  2.0),
  new THREE.Vector3( 12.0, 7.8, -14.0),
  new THREE.Vector3( -1.0, 9.5, -22.0),
  new THREE.Vector3(-13.0, 5.5, -18.0),
  new THREE.Vector3(-18.0, 3.0,  -4.0),
  new THREE.Vector3(-11.0, 2.3, 12.0),
  new THREE.Vector3( -4.0, 4.5, 21.0),
], true, 'centripetal');

let cine = false;
let tCine = 0;
let cineBlend = 1;
const cineStart = new THREE.Vector3();
const lookCur = new THREE.Vector3(0, 2.2, 0);
const _p = new THREE.Vector3();
const _ahead = new THREE.Vector3();
const _look = new THREE.Vector3();
const _m = new THREE.Object3D();

/* ============================== ui / state ============================== */

const FORMS = ['LINE', 'V', 'GRID', 'RING', 'SPIRAL'];
let formIdx = 0;
let alert = false;
let alertMix = 0;
let targets = formationPositions(FORMS[0], N);

const btnF = document.getElementById('btnFormation');
const btnC = document.getElementById('btnCamera');
const btnA = document.getElementById('btnAlert');
const statusEl = document.getElementById('status');

let fps = 0;
function updateStatus() {
  statusEl.innerHTML =
    `UNITS <b>0${N}</b> · FORMATION <b>${FORMS[formIdx]}</b> · CAM <b>${cine ? 'CINEMATIC' : 'ORBIT'}</b>` +
    ` · ALERT <b>${alert ? 'ENGAGED' : 'STANDBY'}</b> · <b>${fps} FPS</b>`;
}

function setFormation(i) {
  formIdx = i;
  targets = formationPositions(FORMS[i], N);
  btnF.textContent = 'FORMATION · ' + FORMS[i];
  updateStatus();
}
function setCamera(c) {
  cine = c;
  if (c) {
    controls.enabled = false;
    cineBlend = 0;
    cineStart.copy(camera.position);
  } else {
    controls.enabled = true;
    controls.target.copy(lookCur);
    controls.update();
  }
  btnC.textContent = 'CAMERA · ' + (c ? 'CINEMATIC' : 'ORBIT');
  btnC.classList.toggle('on', c);
  updateStatus();
}
function setAlert(a) {
  alert = a;
  btnA.textContent = 'ALERT · ' + (a ? 'ENGAGED' : 'OFF');
  btnA.classList.toggle('on', a);
  updateStatus();
}
btnF.addEventListener('click', () => setFormation((formIdx + 1) % FORMS.length));
btnC.addEventListener('click', () => setCamera(!cine));
btnA.addEventListener('click', () => setAlert(!alert));

/* ============================== per-frame updates ============================== */

function updateDrones(t, dt) {
  const kMove = 1 - Math.exp(-dt * 2.0);
  const kTurn = 1 - Math.exp(-dt * 3.0);
  const kY = Math.min(1, dt * 2.5);
  for (let i = 0; i < N; i++) {
    const d = drones[i];
    const gp = d.g;
    const tgt = targets[i];
    gp.position.x += (tgt.x - gp.position.x) * kMove;
    gp.position.z += (tgt.z - gp.position.z) * kMove;
    gp.position.y += ((d.h + Math.sin(t * 1.5 + d.ph) * 0.3) - gp.position.y) * kY;

    const vx = gp.position.x - d.px;
    const vz = gp.position.z - d.pz;
    d.px = gp.position.x;
    d.pz = gp.position.z;
    if (vx * vx + vz * vz > 1e-6) {
      _m.position.set(gp.position.x, 0, gp.position.z);
      _m.lookAt(gp.position.x + vx, 0, gp.position.z + vz);
    } else {
      if (gp.position.x * gp.position.x + gp.position.z * gp.position.z > 0.04) {
        _m.position.set(gp.position.x, 0, gp.position.z);
        _m.lookAt(0, 0, 0);
      }
    }
    gp.quaternion.slerp(_m.quaternion, kTurn);

    const u = gp.userData;
    for (const rt of u.rotors) rt.r.rotation.y += rt.speed * dt;
    u.dome.material.emissiveIntensity = 1.3 + 0.5 * Math.sin(t * 2.2 + d.ph);
    u.nav.material.emissiveIntensity = 0.15 + 2.8 * Math.pow(Math.max(0, Math.sin(t * 2.8 + d.ph)), 4);
    u.glow.material.opacity = 0.3 + 0.12 * Math.sin(t * 2 + d.ph);
  }
  const kRing = 1 - Math.exp(-dt * 2.0);
  for (let i = 0; i < N; i++) {
    const r = targetRings[i];
    r.position.x += (targets[i].x - r.position.x) * kRing;
    r.position.z += (targets[i].z - r.position.z) * kRing;
    r.material.opacity = 0.22 + 0.18 * Math.sin(t * 2.4 + i);
  }
}

function updateBeacons(t) {
  const s = alertMix;
  for (const b of beacons) {
    const idle = 0.5 + 0.5 * Math.sin(t * 1.7 + b.phase);
    const strobe = Math.pow(0.5 + 0.5 * Math.sin(t * 6.5 + b.phase), 6);
    const headI = (0.12 + 0.35 * idle) * (1 - s) + (0.25 + 2.4 * strobe) * s;
    b.capMat.emissiveIntensity = headI;
    b.capMat.emissive.lerpColors(C_AMBER, C_RED, s);
    b.light.intensity = (3 + 9 * idle) * (1 - s) + (18 + 130 * strobe) * s;
    b.light.color.lerpColors(C_AMBER, C_RED, s);
    b.beamMat.color.lerpColors(C_CYAN, C_RED, s);
    b.beamMat.opacity = (0.035 + 0.03 * idle) * (1 - s) + (0.05 + 0.16 * strobe) * s;
    b.beam.rotation.y = t * (0.4 + 1.9 * s) + b.phase;
    b.glow.material.color.lerpColors(C_CYAN, C_RED, s);
    b.glow.material.opacity = (0.25 + 0.15 * idle) * (1 - s) + (0.3 + 0.5 * strobe) * s;
  }
}

function updateRunway(t) {
  const s = alertMix;
  const strobe = Math.pow(0.5 + 0.5 * Math.sin(t * 6), 6);
  runCenterMat.emissiveIntensity = 1.0 + 0.5 * Math.sin(t * 2.4);
  runEdgeMat.emissive.lerpColors(C_AMBER, C_RED, s);
  runEdgeMat.color.lerpColors(runEdgeBaseA, runEdgeBaseR, s);
  runEdgeMat.emissiveIntensity = 0.7 + 0.4 * Math.sin(t * 2.4 + 1) + 1.4 * s * strobe;
  padMat.emissiveIntensity = 0.9 + 0.5 * Math.sin(t * 2);
  barMat.emissiveIntensity = 0.8 + 0.2 * Math.sin(t * 0.9);
  stripMat.emissiveIntensity = 0.45 + 0.25 * Math.sin(t * 1.2);
  chevMat.opacity = 0.55 + 0.35 * Math.sin(t * 2.4);
  const p = (t * 0.05) % 1;
  const tri = p < 0.5 ? p * 2 : 2 - p * 2;
  const z = (tri - 0.5) * 46;
  pulse.position.z = z;
  pulseGlow.position.set(0, 0.3, z);
  pulseMat.opacity = 0.55 + 0.35 * Math.sin(t * 6);
}

function updateFogs(t, dt) {
  for (const f of fogs) {
    const u = f.userData;
    f.material.opacity = u.baseOp * (0.7 + 0.3 * Math.sin(t * 0.4 + u.phase));
    if (u.spin) f.rotation.z += u.spin * dt;
    if (u.x !== undefined) {
      f.position.x += u.x * dt;
      if (f.position.x > 22) f.position.x = -22;
      if (f.position.x < -22) f.position.x = 22;
    }
    if (u.z !== undefined) {
      f.position.z += u.z * dt;
      if (f.position.z > 30) f.position.z = -30;
      if (f.position.z < -30) f.position.z = 30;
    }
  }
}

function updateDust(t, dt) {
  const pos = dustGeo.attributes.position;
  for (let i = 0; i < DUST; i++) {
    let y = pos.getY(i) + dustVel[i] * dt;
    if (y > 13) y = 0.3;
    pos.setY(i, y);
  }
  pos.needsUpdate = true;
  dust.rotation.y += dt * 0.005;
}

function updateCamera(t, dt) {
  if (cine) {
    tCine = (tCine + dt / 52) % 1;
    camPath.getPointAt(tCine, _p);
    _p.y += Math.sin(t * 0.8) * 0.12;
    _p.x += Math.sin(t * 0.55) * 0.1;
    if (cineBlend < 1) {
      cineBlend = Math.min(1, cineBlend + dt / 1.2);
      const e = cineBlend * cineBlend * (3 - 2 * cineBlend);
      _p.lerp(cineStart, 1 - e);
    }
    camPath.getPointAt((tCine + 0.05) % 1, _ahead);
    _look.set(0, 2.2, 0).lerp(_ahead, 0.3);
    lookCur.lerp(_look, 1 - Math.exp(-dt * 3));
    camera.position.copy(_p);
    camera.lookAt(lookCur);
  } else {
    controls.update();
  }
}

/* ============================== main loop ============================== */

const clock = new THREE.Clock();
let frames = 0, fpsT = 0;

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  alertMix += ((alert ? 1 : 0) - alertMix) * Math.min(1, dt * 3);

  updateDrones(t, dt);
  updateBeacons(t);
  updateRunway(t);
  updateFogs(t, dt);
  updateDust(t, dt);
  updateCamera(t, dt);

  frames++;
  fpsT += dt;
  if (fpsT >= 0.5) {
    fps = Math.round(frames / fpsT);
    frames = 0;
    fpsT = 0;
    updateStatus();
  }

  renderer.render(scene, camera);
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

updateStatus();
animate();
</script>
</body>
</html>
